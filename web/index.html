<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gymflow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymFlow</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Modelo de embeddings semanticos rodando 100% no navegador (transformers.js + ONNX/WASM).
    let extractor = null;
    window.gymAIReady = async () => {
      try {
        if (!extractor) {
          const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
          const model = 'Xenova/multilingual-e5-small';
          if (navigator.gpu) {
            try {
              extractor = await pipeline('feature-extraction', model, { device: 'webgpu', dtype: 'fp32' });
              await extractor(['query: teste'], { pooling: 'mean', normalize: true });
            } catch (e) { console.warn('webgpu indisponivel, usando wasm', e); extractor = null; }
          }
          if (!extractor) extractor = await pipeline('feature-extraction', model, { dtype: 'q8' });
        }
        return true;
      } catch (e) { console.error('gymAI', e); return false; }
    };
    window.gymAIEmbed = async (json) => {
      const out = await extractor(JSON.parse(json), { pooling: 'mean', normalize: true });
      return JSON.stringify(out.tolist());
    };
  </script>
  <script>
    // Pede ao navegador que não apague os dados locais (armazenamento persistente).
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
